services:
  notification-service:
    build: .
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      MONGODB_URI: mongodb://mongo:27017/notifications
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
